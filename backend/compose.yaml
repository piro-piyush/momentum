services:
  momentum_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: momentum_backend
    restart: unless-stopped

    ports:
      - "${PORT:-8000}:8000"

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@momentum_db:5432/${POSTGRES_DB:-mydb}

    depends_on:
      momentum_db:
        condition: service_healthy

    volumes:
      - ./:/app
      - /app/node_modules

    networks:
      - momentum_network

  momentum_db:
    image: postgres:18.6-alpine
    container_name: momentum_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}

    volumes:
      - momentum_postgres_data:/var/lib/postgresql/

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - momentum_network

volumes:
  momentum_postgres_data:

networks:
  momentum_network:
    driver: bridge